<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-label="Робот, собранный из модулей">
<!-- platform -->
<ellipse cx="180" cy="368" rx="118" ry="18" fill="#211912" opacity=".16"/>
<rect x="96" y="352" width="168" height="14" rx="7" fill="#FFFDF9" stroke="#211912" stroke-width="7"/>
<!-- legs -->
<g class="r-part" style="--d:.05s">
<rect x="128" y="272" width="34" height="84" rx="16" fill="#FFFDF9" stroke="#211912" stroke-width="7"/>
<rect x="198" y="272" width="34" height="84" rx="16" fill="#FFFDF9" stroke="#211912" stroke-width="7"/>
<circle cx="145" cy="300" r="6" fill="#FF5C00"/><circle cx="215" cy="300" r="6" fill="#FF5C00"/>
<rect x="116" y="330" width="58" height="30" rx="15" fill="#211912"/>
<rect x="186" y="330" width="58" height="30" rx="15" fill="#211912"/>
<circle cx="145" cy="345" r="7" fill="#FFFDF9"/><circle cx="215" cy="345" r="7" fill="#FFFDF9"/>
</g>
<!-- torso -->
<g class="r-part" style="--d:.18s">
<rect x="112" y="150" width="136" height="140" rx="34" fill="#FFFDF9" stroke="#211912" stroke-width="8"/>
<path d="M112 205h136" stroke="#211912" stroke-width="5" opacity=".9"/>
<circle cx="180" cy="246" r="30" fill="#FF5C00" stroke="#211912" stroke-width="8"/>
<circle cx="180" cy="246" r="11" fill="#FFFDF9"/>
<circle cx="132" cy="172" r="5" fill="#211912"/><circle cx="228" cy="172" r="5" fill="#211912"/>
<rect x="150" y="272" width="60" height="10" rx="5" fill="#211912" opacity=".85"/>
</g>
<!-- left arm -->
<g class="r-part" style="--d:.3s">
<path d="M116 180C88 190 76 210 78 236" fill="none" stroke="#211912" stroke-width="8" stroke-linecap="round"/>
<rect x="58" y="196" width="46" height="40" rx="18" fill="#FFFDF9" stroke="#211912" stroke-width="7" transform="rotate(-18 81 216)"/>
<path d="M62 244l-8 18M78 246l-2 19" stroke="#211912" stroke-width="7" stroke-linecap="round"/>
</g>
<!-- right arm raised with bolt -->
<g class="r-part" style="--d:.42s">
<path d="M244 180c26-12 38-32 38-58" fill="none" stroke="#211912" stroke-width="8" stroke-linecap="round"/>
<circle cx="282" cy="112" r="24" fill="#FFFDF9" stroke="#211912" stroke-width="7"/>
<path d="M282 100v24M270 112h24" stroke="#FF5C00" stroke-width="8" stroke-linecap="round"/>
<circle cx="282" cy="112" r="6" fill="#211912"/>
</g>
<!-- head -->
<g class="r-part" style="--d:.54s">
<rect x="104" y="46" width="152" height="112" rx="34" fill="#FFFDF9" stroke="#211912" stroke-width="8"/>
<rect x="126" y="70" width="108" height="56" rx="26" fill="#211912"/>
<circle cx="160" cy="98" r="10" fill="#FF5C00"/><circle cx="200" cy="98" r="10" fill="#FF5C00"/>
<circle cx="163" cy="95" r="3" fill="#FFFDF9"/><circle cx="203" cy="95" r="3" fill="#FFFDF9"/>
<rect x="150" y="132" width="60" height="10" rx="5" fill="#211912" opacity=".8"/>
<rect x="88" y="86" width="18" height="34" rx="9" fill="#FFFDF9" stroke="#211912" stroke-width="7"/>
<rect x="254" y="86" width="18" height="34" rx="9" fill="#FFFDF9" stroke="#211912" stroke-width="7"/>
<path d="M180 46V24" stroke="#211912" stroke-width="8" stroke-linecap="round"/>
<circle cx="180" cy="16" r="10" fill="#FF5C00" stroke="#211912" stroke-width="7"/>
</g>
<!-- schematic ticks -->
<g stroke="#FFFDF9" stroke-width="6" stroke-linecap="round" opacity=".9">
<path d="M40 90v22M29 101h22"/>
<path d="M312 300v22M301 311h22"/>
</g>
<g fill="none" stroke="#FFFDF9" stroke-width="3" stroke-dasharray="3 10" opacity=".55">
<ellipse cx="180" cy="200" rx="158" ry="150"/>
</g>
</svg>
